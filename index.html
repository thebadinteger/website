<!DOCTYPE html>

<body>
    <canvas id="life-canvas"></canvas>

    <div class="lang-switch" id="lang-switch">

        <span class="lang-divider">/</span>
        <button type="button" class="lang-btn" data-lang="ru">ru</button>

    <main class="container">
        <div class="title-wrapper">
            <h1 class="typed-title"><span id="typed-text"></span><span class="cursor">█</span></h1>
        </div>

        <section class="bio-section" id="bio-section">
            <h2 class="bio-title" id="bio-title">hi.</h2>
            <p class="bio-desc" id="bio-desc">
                i'm <strong class="highlight">a reverse engineer</strong>.<br>

                <strong class="highlight">ide:</strong> Zed

        <div class="links-group">

                <button type="button" class="site-btn toggle-btn" id="projects-toggle" aria-expanded="false">
                    <span id="projects-label">projects</span>
                    <span class="arrow-icon" id="projects-arrow">v</span>
                </button>
                <button type="button" class="site-btn toggle-btn" id="support-toggle" aria-expanded="false">
                    <span id="support-label">support</span>
                    <span class="arrow-icon" id="support-arrow">v</span>
                </button>
            </div>

            <div class="accordion-container" id="accordion-container">
                <div class="accordion-inner">
                    <div class="accordion-dropdown" id="projects-panel">
                        <div class="dropdown-items" id="projects-content"></div>
                    </div>

                    <div class="accordion-dropdown" id="support-panel">
                        <div class="dropdown-items" id="support-content"></div>
                    </div>
                </div>
            </div>
        </div>

    <div class="webring-wrapper" id="webring-wrapper">
        <a href="https://webring.otomir23.me/badinteger/prev" class="webring-link webring-side webring-prev" id="webring-prev"><span class="webring-arrow">&lt;</span><span class="webring-name" id="webring-prev-name">prev</span></a>
